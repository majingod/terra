<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f0d0c" />
    <meta name="description" content="Compagnon de jeu pour le GN Terra Mortis : création de personnage, fiches et encyclopédie, utilisable hors ligne." />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <!-- iOS ignore un apple-touch-icon en SVG : il lui faut le PNG. -->
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>Terra Mortis</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- t017 (Q20 A) — le mode soleil est posé AVANT le premier rendu : sinon
         l'app s'allumerait en sombre puis clignerait vers le clair au
         lancement. Même clé que `src/theme/mode.ts` ; un navigateur qui refuse
         le stockage tombe simplement sur le défaut sombre. -->
    <script>
      try { if (localStorage.getItem('tm:mode') === 'soleil') document.documentElement.classList.add('soleil') } catch (e) { /* stockage refusé : sombre */ }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
